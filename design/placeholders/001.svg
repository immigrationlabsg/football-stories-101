<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <radialGradient id="sky" cx="50%" cy="20%" r="80%"><stop offset="0" stop-color="#2b3a5c"/><stop offset="1" stop-color="#0f1428"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/><stop offset="1" stop-color="#fff7d6" stop-opacity="0"/></radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7d4a"/><stop offset="1" stop-color="#1f5a30"/></linearGradient>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1600" fill="url(#sky)"/>
  <g filter="url(#soft)"><circle cx="260" cy="200" r="150" fill="url(#glow)"/><circle cx="1340" cy="200" r="150" fill="url(#glow)"/></g>
  <g filter="url(#wc)">
    <path d="M-50 1050 Q400 980 800 1030 T1650 1010 L1650 1650 L-50 1650 Z" fill="url(#grass)"/>
    <path d="M-50 1180 Q500 1120 1000 1170 T1650 1150 L1650 1650 L-50 1650 Z" fill="#2c6b3a" opacity="0.6"/>
    <ellipse cx="820" cy="1400" rx="520" ry="60" fill="#163f22" opacity="0.5"/>
  </g>
  <!-- crowd haze -->
  <g filter="url(#soft)" opacity="0.8">
    <rect x="0" y="760" width="1600" height="300" fill="#6c5a4a"/>
    <rect x="0" y="820" width="1600" height="240" fill="#8a6f58" opacity="0.5"/>
  </g>
  <!-- figure: stocky striker in white, left foot through the ball -->
  <g filter="url(#wc)">
    <ellipse cx="760" cy="1395" rx="180" ry="30" fill="#0f2a16" opacity="0.6"/>
    <!-- standing leg -->
    <path d="M700 1090 L650 1250 L640 1370 L700 1375 L720 1260 L770 1120 Z" fill="#e8d6c2"/>
    <!-- kicking leg swung through -->
    <path d="M800 1080 L960 1150 L1090 1120 L1100 1170 L950 1220 L790 1150 Z" fill="#e8d6c2"/>
    <path d="M1080 1105 L1180 1090 L1190 1150 L1090 1165 Z" fill="#1a1a1a"/>
    <path d="M630 1365 L720 1370 L725 1410 L625 1405 Z" fill="#1a1a1a"/>
    <!-- shorts -->
    <path d="M660 1000 L880 1000 L900 1110 L800 1130 L720 1140 L650 1120 Z" fill="#fafafa"/>
    <!-- torso -->
    <path d="M640 760 Q770 700 900 760 L930 1010 L630 1010 Z" fill="#ffffff"/>
    <!-- arms -->
    <path d="M640 790 L520 900 L560 940 L690 850 Z" fill="#e8d6c2"/>
    <path d="M900 790 L1020 700 L1050 750 L940 860 Z" fill="#e8d6c2"/>
    <!-- head -->
    <circle cx="775" cy="690" r="72" fill="#e8d6c2"/>
    <path d="M705 670 Q775 600 850 670 Q820 640 775 645 Q735 645 705 670 Z" fill="#2a1d14"/>
    <!-- ball, leather brown, already struck -->
    <circle cx="1240" cy="1080" r="78" fill="#b27a3c"/>
    <path d="M1240 1002 L1265 1060 L1240 1100 L1210 1060 Z" fill="#7d4f21" opacity="0.6"/>
    <path d="M1180 1040 Q1240 1020 1300 1040 M1180 1120 Q1240 1140 1300 1120" stroke="#7d4f21" stroke-width="8" fill="none" opacity="0.6"/>
    <!-- motion wash -->
    <path d="M1310 1070 Q1450 1040 1600 1090" stroke="#fff7d6" stroke-width="22" stroke-linecap="round" opacity="0.35" fill="none"/>
  </g>
  <rect width="1600" height="1600" filter="url(#paper)" opacity="0.9"/>
</svg>
