<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a4a"/><stop offset="1" stop-color="#3b4a6a"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d8a4f"/><stop offset="1" stop-color="#2a5d32"/></linearGradient>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="11"/><feDisplacementMap in="SourceGraphic" scale="30"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1600" fill="url(#sky)"/>
  <g filter="url(#soft)" opacity="0.85"><rect x="0" y="620" width="1600" height="260" fill="#7a5f55"/><rect x="0" y="700" width="1600" height="180" fill="#a3806c" opacity="0.5"/></g>
