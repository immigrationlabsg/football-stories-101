<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FS101 Live">
<meta name="theme-color" content="#0b0d10">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>FS101 Live</title>
<style>
  :root { --bg:#0b0d10; --card:#15181d; --line:#252a31; --ink:#f2f4f6; --dim:#8b949e; --ig:#e1306c; --tt:#25f4ee; --yt:#ff3b30; --th:#c9d1d9; --up:#3fb950; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); -webkit-font-smoothing:antialiased; }
  .island { background:#000; border-radius:28px; padding:14px 18px; display:flex; align-items:center; gap:12px; margin:0 auto 18px; max-width:420px; box-shadow:0 8px 30px #0008; }
  .island .dot { width:9px; height:9px; border-radius:50%; background:var(--up); box-shadow:0 0 8px var(--up); animation:p 2s infinite; flex:none; }
  .island .t { flex:1; min-width:0; } .island .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .island .t span, .muted { color:var(--dim); font-size:12px; }
  .island .big { font:700 26px/1 -apple-system, system-ui; font-variant-numeric:tabular-nums; }
  @keyframes p { 50% { opacity:.35; } }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:22px 2px 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; min-width:0; }
  .net { display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:8px; }
  .net i { width:10px; height:10px; border-radius:3px; flex:none; }
  .v { font:700 28px/1.05 -apple-system, system-ui; font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; gap:6px; margin-top:8px; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .row b { color:var(--ink); font-weight:600; }
  .delta { color:var(--up); font-size:12px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  td, th { padding:8px 4px; border-top:1px solid var(--line); text-align:right; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; border-top:0; font-size:12px; }
  td:first-child, th:first-child { text-align:left; white-space:normal; padding-left:0; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:8px; scrollbar-width:none; }
  .tabs button { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font:inherit; font-size:13px; flex:none; }
  .tabs button[aria-pressed=true] { background:var(--ink); color:var(--bg); }
  .err { color:#f85149; font-size:12px; margin-top:6px; }
  footer { margin-top:22px; text-align:center; }
  @media (min-width:700px) { .grid { grid-template-columns:repeat(4,1fr); } body { max-width:980px; margin:auto; } }
</style>
</head>
<body>
<div class="island" aria-live="polite">
  <span class="dot"></span>
  <div class="t"><b id="story">Loading…</b><span id="upd">Reading the latest numbers</span></div>
  <div style="text-align:right"><div class="big" id="total">–</div><span class="muted">views, all platforms</span></div>
</div>

<h2>Today's story</h2>
<div class="grid" id="today"></div>

<h2>Followers</h2>
<div class="grid" id="followers"></div>

<footer class="muted">Only today's Reel. It switches to the new Reel as soon as it posts (08:00 weekdays, 10:00 weekends).<br>The page checks every minute; new numbers arrive about every 30 minutes.</footer>

<script>
const SRC = 'https://raw.githubusercontent.com/immigrationlabsg/football-stories-101/live-stats/live.json';
const NETS = { instagram:['Instagram','var(--ig)'], tiktok:['TikTok','var(--tt)'], youtube:['YouTube','var(--yt)'], threads:['Threads','var(--th)'] };
const fmt = v => v == null ? '–' : v >= 1e6 ? (v/1e6).toFixed(1)+'m' : v >= 1e4 ? Math.round(v/1e3)+'k' : v >= 1e3 ? (v/1e3).toFixed(1)+'k' : String(v);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = t => { const m = Math.round((Date.now() - Date.parse(t)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m/60) + ' h ago'; };
let data = null, lastViews = {};

function render() {
  if (!data) return;
  const n = data.networks || {}, s = data.today_story;
  let total = 0;
  document.getElementById('story').textContent = s ? data.today_title : 'No Reel yet';
  document.getElementById('upd').textContent = 'Updated ' + ago(data.read_at);
  document.getElementById('today').innerHTML = Object.entries(NETS).map(([k,[name,c]]) => {
    const net = n[k] || {}, p = (net.posts || []).find(x => x.story === s) || {};
    total += p.views || 0;
    const d = lastViews[k] != null && p.views != null && p.views > lastViews[k] ? `<span class="delta">+${fmt(p.views - lastViews[k])}</span>` : '';
    return `<div class="card"><div class="net"><i style="background:${c}"></i>${name}</div>
      <div class="v">${fmt(p.views)} ${d}</div><div class="muted">views${p.at ? ' · posted ' + new Date(p.at).toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Singapore'}) : ''}</div>
      <div class="row"><span>♥ <b>${fmt(p.likes)}</b></span><span>↗ <b>${fmt(p.shares)}</b></span><span>💬 <b>${fmt(p.comments)}</b></span></div>
      ${net.error ? `<div class="err">Not read: ${esc(net.error).slice(0,80)}</div>` : !p.views && p.views !== 0 ? '<div class="muted" style="margin-top:6px">Not posted here yet</div>' : ''}</div>`;
  }).join('');
  document.getElementById('total').textContent = fmt(total);
  document.getElementById('followers').innerHTML = Object.entries(NETS).map(([k,[name,c]]) =>
    `<div class="card"><div class="net"><i style="background:${c}"></i>${name}</div><div class="v">${fmt((n[k]||{}).followers)}</div><div class="muted">followers</div></div>`).join('');
}

async function load() {
  try {
    const r = await fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const next = await r.json();
    if (data && next.read_at !== data.read_at) for (const k in NETS) lastViews[k] = ((data.networks[k]||{}).posts||[]).find(x => x.story === data.today_story)?.views;
    data = next; render();
  } catch (e) { document.getElementById('upd').textContent = data ? 'Updated ' + ago(data.read_at) + ' · offline' : 'Numbers not available yet'; }
}
load(); setInterval(load, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
