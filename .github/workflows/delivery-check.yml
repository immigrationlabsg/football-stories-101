name: Delivery check

# 21 and 41 minutes after each posting slot: fails (and GitHub emails the owner) if today's story is missing on
# Facebook, Instagram or Threads, or if Meta has not actually published the scheduled Facebook post. Asked twice per slot because GitHub's scheduler can skip a run.
on:
  schedule:
    - cron: "21,41 0 * * 1-5" # 08:21 and 08:41 Singapore, Monday to Friday
    - cron: "21,41 2 * * 6,0" # 10:21 and 10:41 Singapore, Saturday and Sunday
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          DELIVERY_GRACE_MIN: "20"
      - run: npm run check-delivery
        if: always()
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
