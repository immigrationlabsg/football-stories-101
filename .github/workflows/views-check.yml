name: Views check

# Read only (scripts/tiktok.ts, MODE=views): every TikTok and YouTube post is checked once, 12-36 hours after it went
# out. The run fails, so GitHub emails the owner, if a post has under 20 views (owner, 11 Nov 2026).
on:
  schedule:
    - cron: "15 13 * * *" # 21:15 Singapore: the 08:00 post is 13 h old, yesterday's 20:00 extra about 25 h
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Age window in hours, e.g. 12-36 (wider to look back further)"
        type: string
        default: "12-36"

permissions:
  contents: read

jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tiktok
        env:
          MODE: views
          WINDOW_HOURS: ${{ inputs.window_hours || '12-36' }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
