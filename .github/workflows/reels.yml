name: Reels

# scripts/reels.ts. "check": is a story's Reel online, and do Instagram and Threads accept it (test containers,
# never published). "switch": schedule Facebook Reels in place of the scheduled picture posts (owner, 24 Oct 2026).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check or switch"
        required: true
        default: check
      from:
        description: "First story number"
        required: true
      to:
        description: "Last story number (empty = same as first)"
        default: ""
      dry_run:
        description: "Dry run (switch only): show what would happen, change nothing"
        type: boolean
        default: true

permissions:
  contents: write

# Shares the posting group, so it never overlaps a posting or scheduling run.
concurrency:
  group: social-posting
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://immigrationlabsg.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/football-stories-101' }}
      WEB_LAG_DAYS: ${{ vars.WEB_LAG_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run reels -- "$ACTION" "$FROM" $TO
        env:
          ACTION: ${{ inputs.action }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Commit the record
        if: ${{ always() && inputs.action == 'switch' && !inputs.dry_run }}
        run: |
          git add data/sent.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git commit -m "chore(publish): Facebook Reels replace scheduled picture posts ${{ inputs.from }}-${{ inputs.to }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
