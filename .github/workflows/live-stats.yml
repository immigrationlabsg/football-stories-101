name: Live stats

# Read only on every network (owner, 11 Nov 2026): every 30 minutes, reads views, likes, shares and followers for
# Instagram and Threads (Meta, as the Audience report does) and TikTok and YouTube (Zernio), writes live.json to the
# live-stats branch for the phone dashboard (public/live/), and about every 2 hours updates the iPhone Dynamic Island
# through PushWard when the PUSHWARD_KEY secret is set. Never touches main, so it never rebuilds the site.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_push:
        description: "Update the Dynamic Island now (uses 1 of the 250 free monthly updates)"
        type: boolean
        default: false

permissions:
  contents: write # only to push live.json to the live-stats branch

concurrency:
  group: live-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Instagram and Threads
        run: SNAPSHOT_FILE="$RUNNER_TEMP/meta.json" npm run -s insights > /dev/null
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Last live.json
        run: git fetch --depth 1 origin live-stats && git show origin/live-stats:live.json > "$RUNNER_TEMP/prev.json" || echo "{}" > "$RUNNER_TEMP/prev.json"
      - name: Read TikTok and YouTube, build live.json, update the Dynamic Island
        run: npm run -s live-stats
        env:
          META_FILE: ${{ runner.temp }}/meta.json
          PREV_FILE: ${{ runner.temp }}/prev.json
          OUT_FILE: ${{ runner.temp }}/live.json
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PUSHWARD_KEY: ${{ secrets.PUSHWARD_KEY }}
          FORCE_PUSH: ${{ inputs.force_push && '1' || '0' }}
      - name: Publish to the live-stats branch (one commit, replaced each time)
        run: |
          d="$RUNNER_TEMP/out" && mkdir -p "$d" && cp "$RUNNER_TEMP/live.json" "$d/" && cd "$d"
          git init -q -b live-stats && git add live.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Live stats $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
