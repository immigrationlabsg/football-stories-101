name: Publish daily

# The heart of the publication (spec 7.1). Runs at the send times, rebuilds
# and redeploys the website (so stories cross the web-lag threshold), then
# sends today's story by email, posts it to Telegram, writes the social
# captions and records the send in data/sent.json.
on:
  # GitHub's scheduler is "best effort": it starts jobs late or drops them, worst on the hour (on 18-20 Oct 2026
  # only one of three 08:00 runs started, 2h23m late). So it is asked eight times each morning, at odd minutes.
  # Every run builds the site, waits until the posting time and posts; once a story is out, later runs do nothing.
  schedule:
    # Monday to Friday, posting at 08:00 Singapore (00:00 UTC): tries from 06:07 to 07:47, backups 08:07 and 08:27.
    - cron: "7,27,47 22 * * 0-4"
    - cron: "7,27,47 23 * * 0-4"
    - cron: "7,27 0 * * 1-5"
    # Saturday and Sunday, posting at 10:00 Singapore (02:00 UTC): same pattern two hours later.
    - cron: "7,27,47 0 * * 6,0"
    - cron: "7,27,47 1 * * 6,0"
    - cron: "7,27 2 * * 6,0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, write social files, but send nothing and record nothing"
        type: boolean
        default: true
      story_number:
        description: "Force a specific story number (leave empty for the normal selection)"
        type: string
        default: ""
      force_resend:
        description: "Allow re-sending a story already in data/sent.json"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WEB_LAG_DAYS: ${{ vars.WEB_LAG_DAYS || '7' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://immigrationlabsg.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/football-stories-101' }}
      PUBLIC_BUTTONDOWN_USERNAME: ${{ vars.PUBLIC_BUTTONDOWN_USERNAME }}
      PUBLIC_TELEGRAM_CHANNEL: ${{ vars.PUBLIC_TELEGRAM_CHANNEL }}
      PUBLIC_FACEBOOK_URL: ${{ vars.PUBLIC_FACEBOOK_URL }}
      PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
      PUBLIC_THREADS_URL: ${{ vars.PUBLIC_THREADS_URL }}
      PUBLIC_UMAMI_SCRIPT: ${{ vars.PUBLIC_UMAMI_SCRIPT }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER || 'buttondown' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The publish step commits back to main, so fetch the branch properly.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore generated images
        uses: actions/cache@v4
        with:
          path: public/images/derived
          key: derived-images-${{ github.run_id }}
          restore-keys: derived-images-
      - run: npm ci

      # 3 to 8: select, send, Telegram, social assets, record, archive fallback.
      - name: Wait for today's posting time
        if: github.event_name == 'schedule'
        run: |
          # Weekdays post at 00:00 UTC (08:00 Singapore), weekends at 02:00 UTC (10:00 Singapore).
          dow=$(TZ=Asia/Singapore date +%u)   # 1 = Monday ... 7 = Sunday, in Singapore
          day=$(TZ=Asia/Singapore date +%F)
          if [ "$dow" -ge 6 ]; then slot="$day 10:00"; else slot="$day 08:00"; fi
          target=$(TZ=Asia/Singapore date -d "$slot" +%s)
          wait=$(( target - $(date +%s) ))
          if [ "$wait" -gt 0 ] && [ "$wait" -lt 10800 ]; then
            echo "Waiting $wait seconds until $slot Singapore time."
            sleep "$wait"
          else
            echo "Posting time $slot Singapore has passed or is not today; going ahead now."
          fi

      - name: Get the latest posting record
        # The run may have waited up to two hours; pick up anything posted or scheduled meanwhile.
        run: git pull --ff-only origin main

      - name: Send today's story
        id: send
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          PUBLISH_STORY_NUMBER: ${{ inputs.story_number }}
          # Every day has a story now, so a scheduled run never falls back to the archive (a backup run would re-send one).
          ALLOW_ARCHIVE_FALLBACK: ${{ github.event_name == 'schedule' && '0' || '1' }}
          FORCE_RESEND: ${{ inputs.force_resend && '1' || '0' }}
        run: npm run publish:daily

      # Then rebuild and redeploy the website, so stories cross the web-lag threshold. This comes after
      # posting so the post goes out on time; a failed deploy does not stop the record being committed.
      - name: Build site
        if: always()
        run: npm run build
      - uses: actions/configure-pages@v5
        if: always()
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: dist
      - id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: Commit send record and social assets
        if: always() && steps.send.outcome != 'skipped'
        run: |
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git add data/sent.json social
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(publish): record send $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push the send record." >&2
          exit 1

      - name: Keep the social assets as a downloadable artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ github.run_id }}
          path: |
            social
            public/images/derived/*-og.png
          if-no-files-found: ignore
          retention-days: 14
