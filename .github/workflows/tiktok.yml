name: TikTok

# TikTok through Zernio (scripts/tiktok.ts). "accounts" and "status" read and change nothing; "post" is a dry run unless
# dry_run is unticked. Each real post is recorded in data/tiktok.json, which stops a second post of the same story.
# Automatic (owner, 10 Nov 2026): when "Publish daily" or "Post extras" finishes, and at backup times, mode "auto" posts
# to TikTok every Reel that went to Instagram in the last 20 hours and is not on TikTok yet; since 11 Nov 2026 the
# same run posts it to YouTube too.
on:
  workflow_run:
    workflows: ["Publish daily", "Post extras"]
    types: [completed]
  schedule:
    # Backups: after the weekday (00:00 UTC) and weekend (02:00 UTC) posts, and after the 12:00 UTC extras.
    - cron: "35 0,1,2,3 * * *"
    - cron: "35 12,13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "accounts (read only), auto (post what is due), post, status or music (read only)"
        type: choice
        options: [accounts, auto, post, status, music]
        default: accounts
      platform:
        description: "tiktok or youtube"
        type: choice
        options: [tiktok, youtube]
        default: tiktok
      story:
        description: "Story number to post (mode post)"
        type: string
        default: ""
      schedule_at:
        description: "YouTube only: publish at this time, e.g. 2026-11-19T08:00:00+08:00 (empty = now)"
        type: string
        default: ""
      dry_run:
        description: "Dry run: show the caption and video, post nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tiktok-posting
  cancel-in-progress: false

jobs:
  tiktok:
    # After a publishing run, only when it succeeded; the backup times cover the rest.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://immigrationlabsg.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/football-stories-101' }}
      PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tiktok
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          STORY: ${{ inputs.story }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'tiktok' }}
          SCHEDULE_AT: ${{ inputs.schedule_at }}
      # Owner, 11 Nov 2026: YouTube posts at the same time as TikTok (ends the 10 Nov pause). Same rules and record
      # file per platform (data/youtube.json), so a story is never posted twice.
      - name: YouTube (automatic runs)
        if: ${{ always() && github.event_name != 'workflow_dispatch' }}
        run: npm run tiktok
        env:
          MODE: auto
          DRY_RUN: '0'
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PLATFORM: youtube
      - name: Commit the record
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || ((inputs.mode == 'post' || inputs.mode == 'auto') && inputs.dry_run != true)) }}
        run: |
          for f in data/tiktok.json data/youtube.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git commit -m "chore(publish): record Zernio post"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
