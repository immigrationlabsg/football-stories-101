name: TikTok

# TikTok through Zernio (scripts/tiktok.ts). Started by hand only for now: "accounts" and "status" read and change nothing;
# "post" is a dry run unless dry_run is unticked. Each real post is recorded in data/tiktok.json.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "accounts (read only), post, or status (read only)"
        type: choice
        options: [accounts, post, status]
        default: accounts
      platform:
        description: "tiktok or youtube"
        type: choice
        options: [tiktok, youtube]
        default: tiktok
      story:
        description: "Story number to post (mode post)"
        type: string
        default: ""
      dry_run:
        description: "Dry run: show the caption and video, post nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tiktok-posting
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://immigrationlabsg.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/football-stories-101' }}
      PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tiktok
        env:
          MODE: ${{ inputs.mode }}
          STORY: ${{ inputs.story }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PLATFORM: ${{ inputs.platform }}
      - name: Commit the record
        if: ${{ always() && inputs.mode == 'post' && inputs.dry_run != true }}
        run: |
          for f in data/tiktok.json data/youtube.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git commit -m "chore(publish): record Zernio post"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
