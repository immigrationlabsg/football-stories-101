name: Reference photos

# Downloads the reference photos chosen in data/reference-photos.json into
# design/references/ so they can be saved on a phone and repainted in ChatGPT.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run references
      - name: Commit
        run: |
          git add design/references
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git commit -m "design: reference photos downloaded"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
