name: Post to social

# Posts one story to Facebook, Instagram and Threads through Meta's official APIs.
# Dry run is on by default: it prints exactly what would be posted and checks that
# every picture is live, but posts nothing. Untick it to post for real.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story number, e.g. 1"
        required: true
      dry_run:
        description: "Dry run: show the posts and check the pictures, post nothing"
        type: boolean
        default: true
      draft:
        description: "Facebook only: save as a DRAFT you can see in Meta Business Suite, publish nothing"
        type: boolean
        default: false
      schedule_at:
        description: "Facebook only: schedule for this time instead (ISO, UTC, e.g. 2026-10-20T00:00:00Z = 8:00 am Singapore). Shows on phones in Business Suite."
        required: false
        default: ""
      networks:
        description: "Networks, space separated (facebook instagram threads)"
        required: false
        default: "facebook instagram threads"

permissions:
  contents: write

# One posting run at a time: a second run starts only after the first has saved its record, so the same
# story can never go out twice (on 20 Oct two overlapping runs both posted story 001 to Threads).
concurrency:
  group: social-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://immigrationlabsg.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/football-stories-101' }}
      WEB_LAG_DAYS: ${{ vars.WEB_LAG_DAYS || '7' }}
      PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run post-social -- "$STORY" $NETWORKS
        env:
          STORY: ${{ inputs.story }}
          NETWORKS: ${{ inputs.networks }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          POST_AS_DRAFT: ${{ inputs.draft && '1' || '0' }}
          SCHEDULE_AT: ${{ inputs.schedule_at }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Commit the record
        # always(): a network that posted is recorded even when another failed, so a re-run never posts it twice
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git add data/sent.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git commit -m "chore(publish): record social posts for story ${{ inputs.story }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not save the record to main; check data/sent.json before any other posting run." >&2
          exit 1
