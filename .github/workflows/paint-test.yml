name: Paint test

# Paints one story three ways (A, B, C) into design/paintings/test/ so the
# editor can pick a recipe. Run by hand only (billed per image).
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story number, e.g. 3"
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run painttest -- "$STORY"
        env:
          STORY: ${{ inputs.story }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Commit
        if: always()
        run: |
          git add design/paintings/test
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "football-stories-101[bot]"
          git config user.email "football-stories-101[bot]@users.noreply.github.com"
          git commit -m "design: paint test results"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
