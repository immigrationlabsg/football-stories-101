name: Check a Facebook post

# Asks Meta whether a post or draft exists and whether it is published. Changes nothing,
# unless "Delete" is ticked, which deletes that one post or draft from the Page.
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID, e.g. 1419297047928388_122094755013522790"
        required: true
      delete:
        description: "Delete this post or draft"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-facebook -- "$POST_ID" $DELETE_FLAG
        env:
          POST_ID: ${{ inputs.post_id }}
          DELETE_FLAG: ${{ inputs.delete && '--delete' || '' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
